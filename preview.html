<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jubeat Memo to StepMania Converter</title>
<style>
body{font-family:sans-serif;max-width:1200px;margin:20px auto;padding:0 16px}
textarea{width:100%;height:260px}
input,select{margin:4px}
.output{height:420px}
</style>
</head>
<body>
<h2>Jubeat Memo → StepMania (.sm) Web版</h2>

<p>jubeatmemo譜面を貼り付けるかTXTを読み込んで変換できます。</p>

<input type="file" id="file"><br><br>

<div>
TITLE <input id="title">
ARTIST <input id="artist">
MUSIC <input id="music">
<select id="ext"><option>.mp3</option><option>.ogg</option></select>
BPM <input id="bpm" value="100" size="6">
LEVEL <input id="level" value="1" size="4">
</div>

<h3>入力</h3>
<textarea id="input"></textarea>

<button onclick="convert()">変換</button>
<button onclick="downloadSM()">SM保存</button>

<h3>出力</h3>
<textarea id="output" class="output"></textarea>

<script>
const circles="①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯";

function gcd(a,b){return b?gcd(b,a%b):a;}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function listLcm(arr){return arr.length?arr.reduce((a,b)=>lcm(a,b)):4;}

function convertCore(text){
  const startMap={};
  [...circles].forEach((c,i)=>startMap[c]=i+1);

  let measures=text.split(/^\s*\d+\s*$/m).filter(x=>x.trim());
  let out=["// measure 0\n0000\n0000\n0000\n0000"];

  measures.forEach((measureText,idx)=>{
    const lines=measureText.trim().split("\n");
    const gridEvents={};
    const beats=[];

    for(const line of lines){
      if(line.includes("|")){
        const parts=line.split("|");
        const grid=parts[0].trim().replaceAll("＜","□").replaceAll("■","□");
        [...grid].slice(0,4).forEach((ch,col)=>{
          if(startMap[ch]){
            const id=startMap[ch];
            gridEvents[id]??=[];
            gridEvents[id].push({col});
          }
        });

        const chars=[...parts[1]];
        if(chars.length) beats.push([chars.length,chars]);
      }else{
        const grid=line.trim();
        [...grid].slice(0,4).forEach((ch,col)=>{
          if(startMap[ch]){
            const id=startMap[ch];
            gridEvents[id]??=[];
            gridEvents[id].push({col});
          }
        });
      }
    }

    if(!beats.length){
      out.push(`// measure ${idx+1}\n0000\n0000\n0000\n0000`);
      return;
    }

    const l=listLcm(beats.map(b=>b[0]));
    const rows=beats.length*l;
    const ticks=Array.from({length:rows},()=>[]);

    beats.forEach(([res,chars],beatIdx)=>{
      const scale=l/res;
      const start=beatIdx*l;

      chars.forEach((ch,charIdx)=>{
        if(startMap[ch]){
          ticks[start+charIdx*scale].push(startMap[ch]);
        }
      });
    });

    let linesOut=[];
    for(let r=0;r<rows;r++){
      let row=["0","0","0","0"];
      ticks[r].forEach(id=>{
        (gridEvents[id]||[]).forEach(ev=>row[ev.col]="1");
      });
      linesOut.push(row.join(""));
    }

    out.push(`// measure ${idx+1}\n`+linesOut.join("\n"));
  });

  return out.join("\n,\n");
}

function convert(){
  const notes=convertCore(document.getElementById("input").value);

  const sm=`#TITLE:${title.value};
#ARTIST:${artist.value};
#MUSIC:${music.value}${ext.value};
#BPMS:0.000=${bpm.value};
#OFFSET:0.000;
#NOTES:
     dance-single:
     :
     Hard:
     ${level.value}:
     0.000,0.000,0.000,0.000:
${notes}
;`;

  output.value=sm;
}

function downloadSM(){
  const blob=new Blob([output.value],{type:"text/plain"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(title.value||"chart")+".sm";
  a.click();
}

file.onchange=e=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    input.value=r.result;
    const name=f.name.replace(/\.[^.]+$/,"");
    title.value=name;
    music.value=name;
  };
  r.readAsText(f);
};
</script>
</body>
</html>
